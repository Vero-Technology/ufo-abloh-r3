# abloh.yml - CI reads this from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails abloh's check in CI. Blocks merges only if also
# marked required in branch protection.
enforce: true

# The job in your own CI that Abloh's step rides. Abloh reads your workflows to
# pick it and proves the choice by running there; change it to move the step.
setup:
  job: .github/workflows/ci.yml::ci

# How CI rebuilds this project for abloh's check. Comments name the source file.
environment:
  runtimeImage: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 # Node 22.23.1 (node-version 22 in your CI), pinned to the digest abloh holds for it
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: corepack pnpm test # scripts.test in package.json
  sealedTestCommand: npx --no-install vitest run --typecheck --reporter=json # runs vitest alone; scripts.test is gated by lint
